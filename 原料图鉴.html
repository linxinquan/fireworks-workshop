<title>原料图鉴 · 烟火小作坊</title>
<style>
  :root{
    --bg:#0c0e13;
    --card:#151922;
    --card-hi:#1b2029;
    --line:rgba(255,255,255,.08);
    --line-hi:rgba(255,255,255,.18);
    --text:#e9edf4;
    --muted:#8b93a4;
    --dim:#5f6779;
    --amber:#ffb703;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 20px 80px;
    position:relative;
    overflow-x:hidden;
  }
  /* 背景光晕 */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px 400px at 15% -5%, rgba(255,183,3,.10), transparent 70%),
      radial-gradient(700px 450px at 85% 5%, rgba(167,139,250,.10), transparent 70%),
      radial-gradient(600px 500px at 50% 110%, rgba(76,201,240,.07), transparent 70%);
  }
  .wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

  /* 头部 */
  header{padding:56px 0 26px;text-align:center}
  .kicker{
    display:inline-block;font-size:12px;letter-spacing:.28em;
    color:var(--amber);opacity:.85;margin-bottom:14px;
    padding:5px 14px;border:1px solid rgba(255,183,3,.28);border-radius:999px;
  }
  h1{
    font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff 10%,#9aa4b8 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin-top:12px;color:var(--muted);font-size:14px}
  .sub b{color:var(--text);font-weight:600}

  /* 筛选 */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin:30px 0 34px;
  }
  .chip{
    appearance:none;cursor:pointer;
    background:var(--card);border:1px solid var(--line);
    color:var(--muted);font-size:13.5px;font-family:inherit;
    padding:8px 16px;border-radius:999px;
    transition:all .18s ease;
  }
  .chip:hover{border-color:var(--line-hi);color:var(--text)}
  .chip.on{
    background:rgba(255,183,3,.13);border-color:rgba(255,183,3,.5);
    color:var(--amber);font-weight:600;
  }
  .chip .n{opacity:.55;margin-left:6px;font-size:12px}

  /* 网格 */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
    gap:14px;
  }
  .card{
    position:relative;cursor:pointer;
    background:linear-gradient(180deg,var(--card-hi),var(--card));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 14px 16px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s,box-shadow .2s;
    animation:in .35s both;
  }
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--c,#fff);
    box-shadow:0 12px 30px -12px var(--glow,rgba(255,255,255,.25)),0 0 0 1px var(--c);
  }
  .icon{
    width:96px;height:96px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .icon svg{width:100%;height:100%;display:block}
  .name{font-size:15px;font-weight:600;letter-spacing:.01em}
  .desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;min-height:32px}
  .meta{margin-top:11px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
  .tag{
    font-size:10.5px;padding:2.5px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim);letter-spacing:.03em;
  }
  .tag.real{color:#7fe3a8;border-color:rgba(127,227,168,.28);background:rgba(127,227,168,.07)}
  .tag.magic{color:#c4a8ff;border-color:rgba(196,168,255,.28);background:rgba(196,168,255,.07)}
  .stars{font-size:10px;letter-spacing:1px;color:var(--c,var(--amber))}

  /* 弹层 */
  .modal{
    position:fixed;inset:0;z-index:50;
    display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(6,8,12,.78);backdrop-filter:blur(6px);
  }
  .modal.on{display:flex;animation:fade .18s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    position:relative;width:100%;max-width:420px;
    background:linear-gradient(180deg,#1b2029,#141821);
    border:1px solid var(--line-hi);border-radius:22px;
    padding:34px 28px 30px;text-align:center;
    animation:pop .24s cubic-bezier(.2,.8,.3,1) both;
    box-shadow:0 30px 80px -20px #000;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .sheet .halo{
    width:130px;height:130px;margin:0 auto 18px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .sheet .halo svg{width:100%;height:100%}
  .sheet h2{font-size:22px;font-weight:700}
  .sheet .role{font-size:13px;color:var(--c,var(--amber));margin-top:7px;font-weight:500}
  .sheet .fact{
    margin-top:20px;padding:16px 18px;text-align:left;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-left:2px solid var(--c,var(--amber));
    border-radius:12px;font-size:13.5px;line-height:1.75;color:#c8d0de;
  }
  .sheet .foot{
    margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  }
  .close{
    position:absolute;top:14px;right:14px;
    width:32px;height:32px;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    color:var(--muted);font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .close:hover{background:rgba(255,255,255,.12);color:#fff}

  footer{
    margin-top:56px;text-align:center;color:var(--dim);font-size:12px;
    letter-spacing:.06em;
  }

  @media (max-width:520px){
    body{padding:0 14px 60px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
    .icon{width:78px;height:78px}
    .card{padding:16px 10px 14px}
  }
</style>

/* ============ 分类配置 ============ */
var TYPES = [
  { key: "all",   label: "全部" },
  { key: "base",  label: "基础原料" },
  { key: "spark", label: "闪光原料" },
  { key: "color", label: "焰色原料" },
  { key: "shape", label: "魔法原料" }
];
var RARITY_NAME = { 2: "稀有", 3: "珍贵", 4: "史诗", 5: "传说" };

/* ============ 工具函数 ============ */
function hexA(hex, a) {
  var h = hex.replace("#", "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function typeLabel(t) {
  for (var i=0;i<TYPES.length;i++) if (TYPES[i].key === t) return TYPES[i].label;
  return t;
}

/* ============ 渲染筛选 ============ */
var current = "all";
var filtersEl = document.getElementById("filters");
TYPES.forEach(function(t){
  var n = t.key === "all" ? INGREDIENTS.length : INGREDIENTS.filter(function(x){return x.type===t.key}).length;
  var b = document.createElement("button");
  b.className = "chip" + (t.key === "all" ? " on" : "");
  b.dataset.key = t.key;
  b.innerHTML = t.label + '<span class="n">' + n + "</span>";
  b.onclick = function(){
    current = t.key;
    [].forEach.call(filtersEl.children, function(c){ c.classList.remove("on") });
    b.classList.add("on");
    render();
  };
  filtersEl.appendChild(b);
});

/* ============ 渲染网格 ============ */
var gridEl = document.getElementById("grid");
var modal = document.getElementById("modal");

function render() {
  var list = INGREDIENTS.filter(function(x){ return current === "all" || x.type === current });
  gridEl.innerHTML = "";
  list.forEach(function(item, i){
    var card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--c", item.color);
    card.style.setProperty("--glow", hexA(item.color, .35));
    card.style.animationDelay = (i * 22) + "ms";

    var tags = '<span class="tag ' + (item.real ? "real" : "magic") + '">' + (item.real ? "真实" : "幻想") + "</span>";
    var stars = item.rarity
      ? '<span class="stars">' + "★".repeat(item.rarity) + "</span>"
      : "";

    card.innerHTML =
      '<div class="icon" style="background:radial-gradient(circle,' + hexA(item.color,.22) + ' 0%,transparent 72%)">' + item.svg + "</div>" +
      '<div class="name">' + item.name + "</div>" +
      '<div class="desc">' + item.desc + "</div>" +
      '<div class="meta">' + tags + stars + "</div>";

    card.onclick = function(){ openSheet(item) };
    gridEl.appendChild(card);
  });
}

/* ============ 详情弹层 ============ */
function openSheet(item) {
  var sheet = document.getElementById("sheet");
  sheet.style.setProperty("--c", item.color);
  document.getElementById("mIcon").innerHTML = item.svg;
  document.getElementById("mIcon").style.background =
    "radial-gradient(circle," + hexA(item.color,.25) + " 0%,transparent 72%)";
  document.getElementById("mName").textContent = item.name;
  document.getElementById("mRole").textContent = typeLabel(item.type) + " · " + item.desc;
  document.getElementById("mFact").textContent = item.fact;

  var foot = document.getElementById("mFoot");
  foot.innerHTML = '<span class="tag ' + (item.real ? "real" : "magic") + '">' + (item.real ? "真实化学" : "幻想魔法") + "</span>";
  if (item.rarity) foot.innerHTML += '<span class="tag" style="color:' + item.color + ';border-color:' + hexA(item.color,.35) + '">' + RARITY_NAME[item.rarity] + " · " + "★".repeat(item.rarity) + "</span>";

  modal.classList.add("on");
}
function closeSheet(){ modal.classList.remove("on") }
document.getElementById("close").onclick = closeSheet;
modal.onclick = function(e){ if (e.target === modal) closeSheet() };
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet() });

render();
</script>
